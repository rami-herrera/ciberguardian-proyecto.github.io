<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CiberGuardian</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #020617,
        #0a2a5e,
        #0077b6,
        #00b4d8
      );
      font-family: "Poppins", sans-serif;
      color: white;
    }

    h1 {
      padding-top: 30px;
      text-align: center;
      font-size: 3rem;
      font-weight: bold;
    }

    .ciber {
      color: white;
    }

    .guardian {
      color: #62d9ff;
    }

    .chat-wrapper {
      width: min(900px, calc(100% - 32px));
      height: 700px;
      margin: 30px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      background: #061426;
    }

    #voiceflow-chat {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 2.2rem;
      }

      .chat-wrapper {
        width: calc(100% - 16px);
        height: 80vh;
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

  <h1>
    <span class="ciber">Ciber</span><span class="guardian">Guardian</span>
  </h1>

  <div class="chat-wrapper">
    <div id="voiceflow-chat"></div>
  </div>

  <script type="text/javascript">
  (function(d, t) {
      var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
      v.onload = function() {
        window.voiceflow.chat.load({
          verify: { projectID: '6ac04564ca4177b3858c3101' },
          url: 'https://general-runtime.voiceflow.com',
          voice: {
            url: 'https://runtime-api.voiceflow.com'
          },
          render: {
            mode: 'embedded',
            target: document.getElementById(...)
          }
        });
      }
      v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs'; v.type = 'text/javascript'; s.parentNode.insertBefore(v, s);
  })(document, 'script');
</script>

</body>
</html>
